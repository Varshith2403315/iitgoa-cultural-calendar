<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Goa Cultural Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --accent-light: #f472b6;
            --accent-dark: #be185d;
            
            --bg: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border: #e5e7eb;
            
            --dance: #e4007c;
            --music: #7b3fe4;
            --drama: #e07a00;
            --art: #00a79d;
            --literary: #2a6fdb;
            --fest: #c2185b;
            --other: #5f6b7a;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --bg-secondary: #1f2937;
                --bg-tertiary: #374151;
                --text: #f3f4f6;
                --text-secondary: #d1d5db;
                --text-tertiary: #9ca3af;
                --border: #4b5563;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
        }
        
        /* Header */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .role-badge {
            background-color: var(--primary);
            color: white;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: capitalize;
            display: none;
        }
        
        .role-badge.visible {
            display: inline-block;
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-family: 'DM Sans', sans-serif;
        }
        
        button:hover {
            background-color: var(--primary-dark);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        button.secondary {
            background-color: var(--bg-tertiary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        button.secondary:hover {
            background-color: var(--border);
        }
        
        button.danger {
            background-color: #dc2626;
        }
        
        button.danger:hover {
            background-color: #b91c1c;
        }
        
        #addEventBtn {
            display: none;
        }
        
        #addEventBtn.visible {
            display: inline-block;
        }
        
        /* Main Container */
        main {
            padding: 2rem 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }
        
        .tab-btn {
            background: none;
            color: var(--text-secondary);
            border: none;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        
        .tab-btn:hover {
            color: var(--text);
        }
        
        .tab-btn.active {
            color: var(--primary);
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--primary);
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        /* Calendar View */
        .calendar-container {
            display: none;
        }
        
        .calendar-container.active {
            display: block;
        }
        
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .calendar-month {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }
        
        .calendar-header {
            text-align: center;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding: 1rem 0.5rem;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
            min-height: 80px;
        }
        
        .calendar-day:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }
        
        .calendar-day.other-month {
            opacity: 0.4;
            cursor: default;
        }
        
        .calendar-day.today {
            background-color: var(--primary);
            color: white;
        }
        
        .calendar-day-number {
            font-weight: 700;
            font-size: 0.875rem;
        }
        
        .event-chip {
            background-color: var(--primary);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .event-chip:hover {
            transform: scale(1.05);
        }
        
        .event-chip.dance { background-color: var(--dance); }
        .event-chip.music { background-color: var(--music); }
        .event-chip.drama { background-color: var(--drama); }
        .event-chip.art { background-color: var(--art); }
        .event-chip.literary { background-color: var(--literary); }
        .event-chip.fest { background-color: var(--fest); }
        .event-chip.other { background-color: var(--other); }
        
        /* Timeline View */
        .timeline-container {
            display: none;
            perspective: 1000px;
        }
        
        .timeline-container.active {
            display: block;
        }
        
        .timeline-stage {
            height: 900px;
            position: relative;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        
        .timeline-track {
            position: relative;
            padding: 200px 0;
        }
        
        .event-card {
            position: absolute;
            left: 5%;
            right: 5%;
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s ease-out;
            transform: translate3d(0, 0, 0) rotateY(0deg);
            opacity: 0.5;
        }
        
        .event-card:nth-child(even) {
            left: auto;
            right: 5%;
            transform-origin: right center;
        }
        
        .event-card:nth-child(odd) {
            left: 5%;
            transform-origin: left center;
        }
        
        .event-card:hover {
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.15);
        }
        
        .event-card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .event-day-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }
        
        .event-month {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .event-card-title {
            font-size: 1.5rem;
            margin: 1rem 0 0.5rem;
        }
        
        .event-card-venue {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        .event-card-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        
        .event-card-tag.dance { background-color: var(--dance); color: white; }
        .event-card-tag.music { background-color: var(--music); color: white; }
        .event-card-tag.drama { background-color: var(--drama); color: white; }
        .event-card-tag.art { background-color: var(--art); color: white; }
        .event-card-tag.literary { background-color: var(--literary); color: white; }
        .event-card-tag.fest { background-color: var(--fest); color: white; }
        .event-card-tag.other { background-color: var(--other); color: white; }
        
        /* Event Details Dialog */
        dialog {
            border: none;
            border-radius: 1rem;
            background-color: var(--bg);
            color: var(--text);
            padding: 0;
            max-width: 90%;
            width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .dialog-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        
        .dialog-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .dialog-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .dialog-content {
            padding: 2rem;
            overflow-y: auto;
            max-height: 70vh;
        }
        
        .dialog-footer {
            padding: 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .event-detail-item {
            margin-bottom: 1.5rem;
        }
        
        .event-detail-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .event-detail-value {
            font-size: 1rem;
        }
        
        .photo-links-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .photo-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: var(--primary);
            color: white;
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            width: fit-content;
        }
        
        .photo-link:hover {
            background-color: var(--primary-dark);
            transform: translateX(4px);
        }
        
        .photo-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        /* Add/Edit Event Modal */
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .tag-input {
            flex: 1;
            min-width: 150px;
        }
        
        .photo-links-input {
            display: flex;
            gap: 0.5rem;
        }
        
        .photo-links-input input {
            flex: 1;
        }
        
        .photo-links-list-edit {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .photo-link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background-color: var(--bg-tertiary);
            border-radius: 0.5rem;
        }
        
        .photo-link-item button {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
        }
        
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .empty-state-text {
            color: var(--text-secondary);
        }
        
        /* Error State */
        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #dc2626;
        }
        
        @media (prefers-color-scheme: dark) {
            .error-message {
                background-color: #7f1d1d;
                color: #fecaca;
            }
        }
        
        /* Success State */
        .success-message {
            background-color: #dcfce7;
            color: #166534;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #22c55e;
            animation: slideIn 0.3s ease-out;
        }
        
        @media (prefers-color-scheme: dark) {
            .success-message {
                background-color: #164e63;
                color: #86efac;
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Loading State */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            
            .header-left, .header-right {
                width: 100%;
                justify-content: center;
            }
            
            main {
                padding: 1rem;
            }
            
            .tabs {
                justify-content: center;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .calendar-grid {
                min-width: 100%;
            }
            
            .event-card {
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            
            dialog {
                width: 95%;
                max-width: 95%;
            }
            
            .timeline-stage {
                height: 600px;
            }
        }
        
        @media (max-width: 480px) {
            .header-title {
                font-size: 1.25rem;
            }
            
            .dialog-header, .dialog-content, .dialog-footer {
                padding: 1rem;
            }
            
            .event-card-title {
                font-size: 1.25rem;
            }
            
            .event-day-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-left">
            <h1 class="header-title">IIT Goa Cultural Calendar</h1>
        </div>
        <div class="header-right">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display: none;">Logout</button>
            <span class="role-badge" id="roleBadge"></span>
            <button id="addEventBtn" class="secondary">+ Add Event</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search events...">
            </div>
            <select id="councilFilter">
                <option value="">All Councils</option>
                <option value="Art Council">Art Council</option>
                <option value="Media Council">Media Council</option>
                <option value="Lit Council">Lit Council</option>
                <option value="General">General Events</option>
            </select>
            <select id="clubFilter">
                <option value="">All Clubs</option>
            </select>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="calendar">Calendar</button>
            <button class="tab-btn" data-tab="timeline">Timeline</button>
        </div>

        <!-- Calendar View -->
        <div class="calendar-container active" id="calendarContainer">
            <div class="calendar-nav">
                <button class="secondary" id="prevMonthBtn">← Prev</button>
                <h2 class="calendar-month" id="calendarMonth"></h2>
                <button class="secondary" id="nextMonthBtn">Next →</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- Timeline View -->
        <div class="timeline-container" id="timelineContainer">
            <div class="timeline-stage" id="timelineStage">
                <div class="timeline-track" id="timelineTrack"></div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <h3 class="empty-state-title">No events match</h3>
            <p class="empty-state-text">Try clearing the search or category filters.</p>
        </div>
    </main>

    <!-- Event Details Dialog -->
    <dialog id="eventDialog">
        <div class="dialog-header">
            <h2 class="dialog-title" id="eventDialogTitle"></h2>
            <button class="dialog-close" aria-label="Close" onclick="document.getElementById('eventDialog').close()">✕</button>
        </div>
        <div class="dialog-content">
            <div class="event-detail-item">
                <div class="event-detail-label">Category</div>
                <span class="event-card-tag" id="eventCategory"></span>
            </div>
            <div class="event-detail-item">
                <div class="event-detail-label">Date & Time</div>
                <div class="event-detail-value">
                    <div id="eventDate"></div>
                    <div id="eventTime"></div>
                </div>
            </div>
            <div class="event-detail-item">
                <div class="event-detail-label">Venue</div>
                <div class="event-detail-value" id="eventVenue"></div>
            </div>
            <div class="event-detail-item">
                <div class="event-detail-label">Description</div>
                <div class="event-detail-value" id="eventDesc"></div>
            </div>
            <div class="event-detail-item" id="notesSection" style="display: none;">
                <div class="event-detail-label">Notes</div>
                <div class="event-detail-value" id="eventNotes"></div>
            </div>
            <div class="event-detail-item" id="photoLinksSection" style="display: none;">
                <div class="event-detail-label">Photo Links</div>
                <div class="photo-links-list" id="photoLinksList"></div>
            </div>
        </div>
        <div class="dialog-footer">
            <button class="secondary" onclick="document.getElementById('eventDialog').close()">Close</button>
            <button id="editEventBtn" style="display: none;">Edit</button>
            <button id="deleteEventBtn" class="danger" style="display: none;">Delete</button>
        </div>
    </dialog>

    <!-- Add/Edit Event Modal -->
    <dialog id="eventFormDialog">
        <div class="dialog-header">
            <h2 class="dialog-title" id="formTitle">Add Event</h2>
            <button class="dialog-close" aria-label="Close" onclick="document.getElementById('eventFormDialog').close()">✕</button>
        </div>
        <div class="dialog-content">
            <form id="eventForm" class="modal-form">
                <div class="form-group">
                    <label for="eventTitle">Event Title *</label>
                    <input type="text" id="eventTitle" required>
                </div>

                <div class="form-group">
                    <label for="eventDate">Date (YYYY-MM-DD) *</label>
                    <input type="text" id="eventDate" placeholder="2024-12-25" required>
                </div>

                <div class="form-group">
                    <label for="eventTime">Time (HH:MM) *</label>
                    <input type="text" id="eventTime" placeholder="18:30" required>
                </div>

                <div class="form-group">
                    <label for="eventVenue">Venue *</label>
                    <input type="text" id="eventVenue" required>
                </div>

                <div class="form-group">

    <!-- Firebase Configuration -->
    <script type="module">
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyC86CA_FJF0Lc5WHBF6WNyOrACVfgUMdjk",
            authDomain: "iit-goa-cultural-calendar.firebaseapp.com",
            projectId: "iit-goa-cultural-calendar",
            appId: "1:598654025498:web:2fa7917eea397aa187b6a3"
        };

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, query, where, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let currentUser = null;
        let currentUserRole = null;
        let allEvents = [];
        let filteredEvents = [];
        let currentMonth = new Date();
        let selectedEventId = null;
        let editingEventId = null;
        let scrollThrottleId = null;
        let councilsData = {};
        let clubsData = {};

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showMessage(containerId, message, type = 'error') {
            const container = document.getElementById(containerId);
            const messageClass = type === 'error' ? 'error-message' : 'success-message';
            container.innerHTML = `<div class="${messageClass}">${escapeHtml(message)}</div>`;
            if (type === 'success') {
                setTimeout(() => {
                    container.innerHTML = '';
                }, 3000);
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }

        function isSameDay(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                   date1.getMonth() === date2.getMonth() &&
                   date1.getDate() === date2.getDate();
        }

        function getEventColor(category) {
            const colors = {
                'dance': 'dance',
                'music': 'music',
                'drama': 'drama',
                'art': 'art',
                'literary': 'literary',
                'fest': 'fest',
                'other': 'other'
            };
            return colors[category] || 'other';
        }

        function initializeCouncilsAndClubs() {
            councilsData = {
                'Art Council': ['Photography Club', 'Painting Club', 'Sculpture Club'],
                'Media Council': ['Photography Club', 'Videography Club', 'Podcast Club'],
                'Lit Council': ['Writing Club', 'Debate Club', 'Poetry Club']
            };
            clubsData = {};
            Object.keys(councilsData).forEach(council => {
                clubsData[council] = councilsData[council];
            });
        }

        function populateCouncilsCheckboxes() {
            const container = document.getElementById('councilsContainer');
            container.innerHTML = '';
            Object.keys(councilsData).forEach(council => {
                const label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '0.5rem';
                label.style.marginBottom = '0.5rem';
                label.innerHTML = `
                    <input type="checkbox" class="council-checkbox" value="${council}" data-council="${council}">
                    ${escapeHtml(council)}
                `;
                container.appendChild(label);
            });
        }

        // ============================================
        // AUTHENTICATION
        // ============================================
        async function loadUserRole(uid) {
            try {
                const roleDoc = await getDoc(doc(db, 'roles', uid));
                if (roleDoc.exists()) {
                    currentUserRole = roleDoc.data().role;
                    updateUIBasedOnRole();
                } else {
                    currentUserRole = null;
                    updateUIBasedOnRole();
                }
            } catch (error) {
                console.error('Error loading user role:', error);
            }
        }

        function updateUIBasedOnRole() {
            const addEventBtn = document.getElementById('addEventBtn');
            const editEventBtn = document.getElementById('editEventBtn');
            const deleteEventBtn = document.getElementById('deleteEventBtn');
            const notesFormGroup = document.getElementById('notesFormGroup');
            const photoLinksFormGroup = document.getElementById('photoLinksFormGroup');
            const roleBadge = document.getElementById('roleBadge');

            if (currentUserRole) {
                roleBadge.textContent = currentUserRole.toUpperCase();
                roleBadge.classList.add('visible');
            } else {
                roleBadge.classList.remove('visible');
            }

            if (currentUserRole === 'gensec') {
                addEventBtn.classList.add('visible');
                notesFormGroup.style.display = 'block';
            } else {
                addEventBtn.classList.remove('visible');
                notesFormGroup.style.display = 'none';
            }

            if (currentUserRole === 'gensec' || currentUserRole === 'originals') {
                photoLinksFormGroup.style.display = 'block';
            } else {
                photoLinksFormGroup.style.display = 'none';
            }

            if (selectedEventId && editingEventId === null) {
                editEventBtn.style.display = currentUserRole === 'gensec' ? 'block' : 'none';
                deleteEventBtn.style.display = currentUserRole === 'gensec' ? 'block' : 'none';
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadUserRole(user.uid);
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                currentUser = null;
                currentUserRole = null;
                updateUIBasedOnRole();
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
            renderAllViews();
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginDialog').showModal();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageContainer = document.getElementById('loginMessage');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('loginDialog').close();
                document.getElementById('loginForm').reset();
                messageContainer.innerHTML = '';
            } catch (error) {
                showMessage('loginMessage', error.message, 'error');
            }
        });

        // ============================================
        // EVENTS MANAGEMENT
        // ============================================
        async function loadEvents() {
            try {
                const eventsCollection = collection(db, 'events');
                const snapshot = await getDocs(eventsCollection);
                allEvents = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                filterAndRenderEvents();
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function filterAndRenderEvents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const councilFilter = document.getElementById('councilFilter').value;
            const clubFilter = document.getElementById('clubFilter').value;

            filteredEvents = allEvents.filter(event => {
                const matchesSearch = !searchTerm || 
                    event.title.toLowerCase().includes(searchTerm) ||
                    event.venue.toLowerCase().includes(searchTerm) ||
                    (event.desc && event.desc.toLowerCase().includes(searchTerm)) ||
                    (event.notes && event.notes.toLowerCase().includes(searchTerm));

                const matchesCouncil = !councilFilter || 
                    (event.tags && event.tags.councils && event.tags.councils.includes(councilFilter)) ||
                    (councilFilter === 'General' && (!event.tags || !event.tags.councils || event.tags.councils.length === 0));

                const matchesClub = !clubFilter || 
                    (event.tags && event.tags.clubs && event.tags.clubs.includes(clubFilter));

                return matchesSearch && matchesCouncil && matchesClub;
            });

            renderAllViews();
        }

        function renderAllViews() {
            renderCalendar();
            renderTimeline();
            checkEmptyState();
        }

        function renderCalendar() {
            const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const lastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const prevLastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 0);

            const grid = document.getElementById('calendarGrid');
            const monthLabel = document.getElementById('calendarMonth');

            monthLabel.textContent = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            grid.innerHTML = '';

            // Add day headers
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            // Add previous month days
            for (let i = firstDay.getDay() - 1; i >= 0; i--) {
                const dayNum = prevLastDay.getDate() - i;
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day other-month';
                dayElement.innerHTML = `<div class="calendar-day-number">${dayNum}</div>`;
                grid.appendChild(dayElement);
            }

            // Add current month days
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const currentDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                if (isSameDay(currentDate, new Date())) {
                    dayElement.classList.add('today');
                }

                const dayNumberDiv = document.createElement('div');
                dayNumberDiv.className = 'calendar-day-number';
                dayNumberDiv.textContent = day;
                dayElement.appendChild(dayNumberDiv);

                // Add events for this day
                const dayEvents = filteredEvents.filter(event => event.date === `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`);
                dayEvents.slice(0, 3).forEach(event => {
                    const chip = document.createElement('div');
                    chip.className = `event-chip ${getEventColor(event.category)}`;
                    chip.textContent = escapeHtml(event.title.substring(0, 10));
                    chip.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showEventDetails(event.id);
                    });
                    dayElement.appendChild(chip);
                });

                dayElement.addEventListener('click', () => {
                    const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayEventIds = filteredEvents.filter(e => e.date === dateStr).map(e => e.id);
                    if (dayEventIds.length > 0) {
                        showEventDetails(dayEventIds[0]);
                    }
                });

                grid.appendChild(dayElement);
            }

            // Add next month days
            const totalCells = grid.children.length - 7; // Excluding headers
            const remainingCells = 42 - totalCells; // 6 rows × 7 columns
            for (let i = 1; i <= remainingCells; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day other-month';
                dayElement.innerHTML = `<div class="calendar-day-number">${i}</div>`;
                grid.appendChild(dayElement);
            }
        }

        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.innerHTML = '';

            const sortedEvents = [...filteredEvents].sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return dateA - dateB;
            });

            sortedEvents.forEach((event, index) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.innerHTML = `
                    <div class="event-month">${new Date(event.date).toLocaleDateString('en-US', { month: 'short' })}</div>
                    <div class="event-day-number">${new Date(event.date).getDate()}</div>
                    <h3 class="event-card-title">${escapeHtml(event.title)}</h3>
                    <div class="event-card-venue">📍 ${escapeHtml(event.venue)}</div>
                    <span class="event-card-tag ${getEventColor(event.category)}">${escapeHtml(event.category)}</span>
                `;
                card.style.top = `${index * 300 + 200}px`;
                card.addEventListener('click', () => showEventDetails(event.id));
                card.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        showEventDetails(event.id);
                    }
                });
                track.appendChild(card);
            });

            track.style.height = `${Math.max(sortedEvents.length * 300, 1000)}px`;
        }

        function updateTimelineOnScroll() {
            const stage = document.getElementById('timelineStage');
            const track = document.getElementById('timelineTrack');
            const cards = track.querySelectorAll('.event-card');
            const centerY = stage.clientHeight / 2;
            const scrollProgress = stage.scrollTop / (stage.scrollHeight - stage.clientHeight);

            cards.forEach((card, index) => {
                const cardTop = parseFloat(card.style.top);
                const cardCenter = cardTop + 100; // Approximate card height/2
                const distance = cardCenter - (stage.scrollTop + centerY);
                const progress = Math.max(-1, Math.min(1, distance / centerY));
                
                const zDepth = Math.max(0, 500 * (1 - Math.abs(progress)));
                const opacity = Math.max(0.3, 1 - Math.abs(progress) * 0.7);
                const rotateY = progress * 15;
                const scale = 1 - Math.abs(progress) * 0.1;

                card.style.transform = `translate3d(0, 0, ${zDepth}px) rotateY(${rotateY}deg) scale(${scale})`;
                card.style.opacity = opacity;
            });
        }

        document.getElementById('timelineStage').addEventListener('scroll', () => {
            cancelAnimationFrame(scrollThrottleId);
            scrollThrottleId = requestAnimationFrame(updateTimelineOnScroll);
        }, { passive: true });

        // ============================================
        // EVENT DETAILS DIALOG
        // ============================================
        async function showEventDetails(eventId) {
            selectedEventId = eventId;
            editingEventId = null;

            const event = allEvents.find(e => e.id === eventId);
            if (!event) return;

            document.getElementById('eventDialogTitle').textContent = escapeHtml(event.title);
            document.getElementById('eventCategory').textContent = escapeHtml(event.category);
            document.getElementById('eventCategory').className = `event-card-tag ${getEventColor(event.category)}`;
            document.getElementById('eventDate').textContent = formatDate(event.date);
            document.getElementById('eventTime').textContent = escapeHtml(event.time);
            document.getElementById('eventVenue').textContent = escapeHtml(event.venue);
            document.getElementById('eventDesc').textContent = escapeHtml(event.desc);

            // Show notes only to gensec
            const notesSection = document.getElementById('notesSection');
            if (currentUserRole === 'gensec' && event.notes) {
                notesSection.style.display = 'block';
                document.getElementById('eventNotes').textContent = escapeHtml(event.notes);
            } else {
                notesSection.style.display = 'none';
            }

            // Show photo links
            const photoLinksSection = document.getElementById('photoLinksSection');
            const photoLinksList = document.getElementById('photoLinksList');
            photoLinksList.innerHTML = '';

            if (event.photoLinks && event.photoLinks.length > 0) {
                photoLinksSection.style.display = 'block';
                event.photoLinks.forEach((link, index) => {
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = 'photo-link';
                    a.textContent = `Photo Album ${index + 1}`;
                    photoLinksList.appendChild(a);
                });
            } else {
                photoLinksSection.style.display = 'none';
            }

            updateUIBasedOnRole();
            document.getElementById('eventDialog').showModal();
        }

        document.getElementById('editEventBtn').addEventListener('click', () => {
            const event = allEvents.find(e => e.id === selectedEventId);
            if (!event) return;

            editingEventId = selectedEventId;
            document.getElementById('eventDialog').close();
            openEventForm(event);
        });

        document.getElementById('deleteEventBtn').addEventListener('click', () => {
            document.getElementById('eventDialog').close();
            document.getElementById('deleteConfirmDialog').showModal();
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            try {
                if (currentUserRole !== 'gensec') {
                    alert('Only GenSec can delete events');
                    return;
                }
                await deleteDoc(doc(db, 'events', selectedEventId));
                document.getElementById('deleteConfirmDialog').close();
                await loadEvents();
            } catch (error) {
                console.error('Error deleting event:', error);
                alert('Error deleting event: ' + error.message);
            }
        });

        // ============================================
        // ADD/EDIT EVENT FORM
        // ============================================
        document.getElementById('addEventBtn').addEventListener('click', () => {
            editingEventId = null;
            openEventForm(null);
        });

        function openEventForm(event) {
            populateCouncilsCheckboxes();
            const formTitle = document.getElementById('formTitle');
            const form = document.getElementById('eventForm');

            if (event) {
                formTitle.textContent = 'Edit Event';
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time;
                document.getElementById('eventVenue').value = event.venue;
                document.getElementById('eventCategory').value = event.category;
                document.getElementById('eventDesc').value = event.desc;
                document.getElementById('eventNotes').value = event.notes || '';

                // Check councils
                if (event.tags && event.tags.councils) {
                    event.tags.councils.forEach(council => {
                        const checkbox = document.querySelector(`[data-council="${council}"]`);
                        if (checkbox) checkbox.checked = true;
                    });
                }

                // Load photo links
                const photoLinksList = document.getElementById('photoLinksEditList');
                photoLinksList.innerHTML = '';
                if (event.photoLinks && event.photoLinks.length > 0) {
                    event.photoLinks.forEach(link => {
                        addPhotoLinkToList(link);
                    });
                }
            } else {
                formTitle.textContent = 'Add Event';
                form.reset();
                document.getElementById('photoLinksEditList').innerHTML = '';
            }

            document.getElementById('eventFormDialog').showModal();
        }

        document.getElementById('addPhotoLinkBtn').addEventListener('click', () => {
            const input = document.getElementById('photoLinkInput');
            const link = input.value.trim();

            if (!link) {
                alert('Please enter a URL');
                return;
            }

            if (!link.startsWith('https://')) {
                alert('URL must start with https://');
                return;
            }

            addPhotoLinkToList(link);
            input.value = '';
        });

        function addPhotoLinkToList(link) {
            const list = document.getElementById('photoLinksEditList');
            const item = document.createElement('div');
            item.className = 'photo-link-item';
            item.innerHTML = `
                <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.substring(0, 50))}</a>
                <button type="button" class="danger" data-link="${escapeHtml(link)}">Remove</button>
            `;
            item.querySelector('button').addEventListener('click', (e) => {
                e.preventDefault();
                item.remove();
            });
            list.appendChild(item);
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (currentUserRole !== 'gensec') {
                alert('Only GenSec can add or edit events');
                return;
            }

            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value.trim();
            const time = document.getElementById('eventTime').value.trim();
            const venue = document.getElementById('eventVenue').value.trim();
            const category = document.getElementById('eventCategory').value;
            const desc = document.getElementById('eventDesc').value.trim();
            const notes = document.getElementById('eventNotes').value.trim();

            // Validate date format
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                alert('Date must be in YYYY-MM-DD format');
                return;
            }

            // Validate time format
            if (!/^\d{2}:\d{2}$/.test(time)) {
                alert('Time must be in HH:MM format');
                return;
            }

            // Get selected councils
            const selectedCouncils = Array.from(document.querySelectorAll('.council-checkbox:checked')).map(cb => cb.value);

            // Get photo links
            const photoLinks = Array.from(document.querySelectorAll('.photo-link-item a')).map(a => a.href);

            if (!title || !date || !time || !venue || !category || !desc) {
                alert('Please fill in all required fields');
                return;
            }

            const eventData = {
                title,
                date,
                time,
                venue,
                category,
                desc,
                notes,
                tags: {
                    councils: selectedCouncils,
                    clubs: []
                },
                photoLinks: photoLinks || []
            };

            try {
                if (editingEventId) {
                    // Edit existing event
                    await updateDoc(doc(db, 'events', editingEventId), eventData);
                } else {
                    // Add new event
                    await addDoc(collection(db, 'events'), eventData);
                }
                document.getElementById('eventFormDialog').close();
                await loadEvents();
            } catch (error) {
                console.error('Error saving event:', error);
                alert('Error saving event: ' + error.message);
            }
        });

        // ============================================
        // TAB SWITCHING
        // ============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const tab = btn.dataset.tab;
                document.getElementById('calendarContainer').classList.remove('active');
                document.getElementById('timelineContainer').classList.remove('active');

                if (tab === 'calendar') {
                    document.getElementById('calendarContainer').classList.add('active');
                } else {
                    document.getElementById('timelineContainer').classList.add('active');
                    updateTimelineOnScroll();
                }
            });
        });

        // ============================================
        // MONTH NAVIGATION
        // ============================================
        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        });

        // ============================================
        // FILTERS
        // ============================================
        document.getElementById('searchInput').addEventListener('input', filterAndRenderEvents);
        document.getElementById('councilFilter').addEventListener('change', filterAndRenderEvents);
        document.getElementById('clubFilter').addEventListener('change', filterAndRenderEvents);

        // ============================================
        // EMPTY STATE
        // ============================================
        function checkEmptyState() {
            const emptyState = document.getElementById('emptyState');
            const calendarContainer = document.getElementById('calendarContainer');
            const timelineContainer = document.getElementById('timelineContainer');

            if (filteredEvents.length === 0) {
                emptyState.style.display = 'block';
                calendarContainer.style.display = 'none';
                timelineContainer.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                if (document.querySelector('.tab-btn.active').dataset.tab === 'calendar') {
                    calendarContainer.style.display = 'block';
                    timelineContainer.style.display = 'none';
                } else {
                    calendarContainer.style.display = 'none';
                    timelineContainer.style.display = 'block';
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        initializeCouncilsAndClubs();
        loadEvents();
    </script>
</body>
</html>
